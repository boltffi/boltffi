[package]
name = "boltffi_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for BoltFFI - generate Swift, Kotlin, and WASM bindings from Rust"
homepage = "https://boltffi.dev"
readme = "../README.md"
keywords = ["ffi", "cli", "codegen", "swift", "kotlin"]
categories = ["development-tools::ffi", "development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "boltffi"
path = "src/main.rs"

[dependencies]
askama = { version = "0.16", features = ["serde_json"] }
boltffi_bindgen.workspace = true
boltffi_backend.workspace = true
boltffi_binding.workspace = true
boltffi_verify.workspace = true
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
clap = { version = "4.4", features = ["derive"] }
serde.workspace = true
toml = "1.0"
thiserror.workspace = true
which = "8.0"
sha2 = "0.11"
hex = "0.4"
zip = "8.1"
walkdir.workspace = true
serde_json.workspace = true
console = "0.16"
indicatif = "0.18"
object.workspace = true
wasmparser = "0.244"
semver = { version = "1", features = ["serde"] }
oxc_allocator = "0.120"
oxc_ast = "0.120"
oxc_parser = "0.120"
oxc_span = "0.120"
tempfile = "3.23.0"

[dev-dependencies]
wat = "1.244"

[target.'cfg(windows)'.dependencies]
dunce = "1.0"

[lints]
workspace = true
