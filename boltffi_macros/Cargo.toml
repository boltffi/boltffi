[package]
name = "boltffi_macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for BoltFFI - #[data], #[export], #[error] attributes"
keywords = ["ffi", "proc-macro", "codegen", "bindings"]
categories = ["development-tools::ffi", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["printing", "visit-mut"] }
quote.workspace = true
proc-macro2.workspace = true
proc-macro-crate = "3.5"
boltffi_ast.workspace = true
boltffi_binding.workspace = true
boltffi_scan.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
boltffi = { path = "../boltffi" }
trybuild = "1.0.121"

[lints]
workspace = true
