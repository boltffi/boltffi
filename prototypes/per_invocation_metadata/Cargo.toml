[workspace]
resolver = "3"
members = ["pim_runtime", "pim_macros", "pim_dep", "pim_toy", "pim_reader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
pim_runtime = { path = "pim_runtime" }
pim_macros = { path = "pim_macros" }
pim_dep = { path = "pim_dep" }
object = "0.39"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
trybuild = "1.0"

[profile.release-lto]
inherits = "release"
opt-level = 3
debug = "none"
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1
