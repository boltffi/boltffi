[cases."enums.c_style.status.basic"]
summary = "C-style status enums round-trip and branch"
description = "Status enum values cross the wire, render to strings, and drive boolean helper logic."
exercises = [
  "enums::c_style::echo_status",
  "enums::c_style::status_to_string",
  "enums::c_style::is_active",
]

[cases."enums.c_style.status.vec"]
summary = "Vectors of status enums round-trip"
description = "A vector of C-style status enum values preserves variant order and values."
exercises = ["enums::c_style::echo_vec_status"]

[cases."enums.c_style.direction.basic"]
summary = "Direction enums round-trip and transform"
description = "Direction enum values cross the wire and can be transformed to their opposite direction."
exercises = [
  "enums::c_style::echo_direction",
  "enums::c_style::opposite_direction",
]

[cases."enums.repr_int.priority.basic"]
summary = "repr(i32) priority enums round-trip and classify"
description = "Explicitly represented priority enum values preserve their identity and drive label and threshold helpers."
exercises = [
  "enums::repr_int::echo_priority",
  "enums::repr_int::priority_label",
  "enums::repr_int::is_high_priority",
]

[cases."enums.repr_int.priority.basic".excluded_platforms]
csharp = "The C# demo currently covers Priority as record and data-enum fields, not through the repr_int priority helper functions."

[cases."enums.repr_int.log_level.basic"]
summary = "repr(u8) log level enums round-trip and compare"
description = "Log level enum values with a non-i32 backing type cross the wire and compare against a minimum level."
exercises = [
  "enums::repr_int::echo_log_level",
  "enums::repr_int::should_log",
]

[cases."enums.repr_int.log_level.vec"]
summary = "Vectors of repr(u8) log levels round-trip"
description = "A vector of u8-backed enum values preserves variant order and values."
exercises = ["enums::repr_int::echo_vec_log_level"]

[cases."enums.repr_int.http_code.discriminants"]
summary = "repr(u16) HTTP enum discriminants are preserved"
description = "Gapped u16-backed enum discriminants survive construction and round-trip without positional renumbering."
exercises = [
  "enums::repr_int::echo_http_code",
  "enums::repr_int::http_code_not_found",
]

[cases."enums.repr_int.http_code.discriminants".excluded_platforms]
python = "The Python enum demo tests do not currently cover HttpCode discriminants."

[cases."enums.repr_int.sign.discriminants"]
summary = "repr(i8) signed enum discriminants are preserved"
description = "Negative i8-backed enum discriminants survive construction and round-trip without unsigned reinterpretation."
