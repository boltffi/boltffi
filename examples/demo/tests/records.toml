[cases."records.blittable.point.functions"]
summary = "Point records round-trip through free functions"
description = "A blittable point record crosses the wire as input and output through echo, construction, and addition helpers."
exercises = [
  "records::blittable::echo_point",
  "records::blittable::make_point",
  "records::blittable::add_points",
]

[cases."records.blittable.point.try_make"]
summary = "Point construction can return Some or None"
description = "Point construction through an optional return distinguishes a valid point from the zero-point sentinel."
exercises = ["records::blittable::try_make_point"]

[cases."records.blittable.point.try_make".excluded_platforms]
csharp = "The C# blittable record demo does not currently cover try_make_point."
java = "The Java blittable record demo does not currently cover try_make_point."
python = "The Python blittable record demo does not currently cover try_make_point."

