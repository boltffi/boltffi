[cases."primitives.scalars.echo_f32.basic"]
summary = "f32 values round-trip"
description = "An f32 crosses the wire and returns within the expected floating-point tolerance."
exercises = ["primitives::scalars::echo_f32"]

[cases."primitives.scalars.add_f32.basic"]
summary = "f32 values add"
description = "Two f32 values cross the wire and return as their sum within tolerance."
exercises = ["primitives::scalars::add_f32"]

[cases."primitives.scalars.echo_f64.pi"]
summary = "f64 values round-trip"
description = "A high-precision f64 crosses the wire and returns within tolerance."
exercises = ["primitives::scalars::echo_f64"]

[cases."primitives.scalars.add_f64.basic"]
summary = "f64 values add"
description = "Two f64 values cross the wire and return as their sum within tolerance."
exercises = ["primitives::scalars::add_f64"]

[cases."primitives.strings.echo.empty"]
summary = "Empty strings round-trip"
description = "An empty host string crosses the wire and returns as an empty string."
exercises = ["primitives::strings::echo_string"]

[cases."primitives.strings.echo.emoji"]
summary = "Emoji strings round-trip"
description = "A host string containing an emoji crosses the wire and returns unchanged."
exercises = ["primitives::strings::echo_string"]

[cases."primitives.strings.concat.basic"]
summary = "Strings concatenate"
description = "Two non-empty host strings cross the wire and return as one concatenated string."
exercises = ["primitives::strings::concat_strings"]

[cases."primitives.strings.length.utf8_bytes"]
summary = "String length counts UTF-8 bytes"
description = "A string containing a non-ASCII code point reports its UTF-8 byte length."
exercises = ["primitives::strings::string_length"]

[cases."primitives.strings.is_empty.empty"]
summary = "Empty strings are detected"
description = "An empty host string crosses the wire and is reported as empty."
exercises = ["primitives::strings::string_is_empty"]

[cases."primitives.strings.repeat.basic"]
summary = "Strings repeat"
description = "A host string and repeat count cross the wire and return the repeated string."
exercises = ["primitives::strings::repeat_string"]

[cases."primitives.vecs.echo_i32.basic"]
summary = "i32 vectors round-trip"
description = "A non-empty i32 vector crosses the wire and returns unchanged."
exercises = ["primitives::vecs::echo_vec_i32"]

[cases."primitives.vecs.echo_i32.empty"]
summary = "Empty i32 vectors round-trip"
description = "An empty i32 vector crosses the wire and returns as an empty vector."
exercises = ["primitives::vecs::echo_vec_i32"]

[cases."primitives.vecs.sum_i32.basic"]
summary = "i32 vectors sum"
description = "An i32 vector crosses the wire and returns as the sum of its values."
exercises = ["primitives::vecs::sum_vec_i32"]

[cases."primitives.vecs.echo_f64.basic"]
summary = "f64 vectors round-trip"
description = "A non-empty f64 vector crosses the wire and returns unchanged."
exercises = ["primitives::vecs::echo_vec_f64"]

[cases."primitives.vecs.echo_bool.basic"]
summary = "Boolean vectors round-trip"
description = "A non-empty boolean vector crosses the wire and returns unchanged."
exercises = ["primitives::vecs::echo_vec_bool"]

[cases."primitives.vecs.echo_i8.basic"]
summary = "i8 vectors round-trip"
description = "A non-empty i8 vector crosses the wire and returns unchanged."
exercises = ["primitives::vecs::echo_vec_i8"]

[cases."primitives.vecs.echo_u8.basic"]
summary = "u8 vectors round-trip"
description = "A non-empty u8 vector crosses the wire and returns unchanged."
exercises = ["primitives::vecs::echo_vec_u8"]

[cases."primitives.vecs.echo_f32.basic"]
summary = "f32 vectors round-trip"
description = "A non-empty f32 vector crosses the wire and returns unchanged within tolerance."
exercises = ["primitives::vecs::echo_vec_f32"]

[cases."primitives.vecs.make_range.basic"]
summary = "Ranges are generated"
description = "Start and end bounds cross the wire and return as an i32 range."
exercises = ["primitives::vecs::make_range"]

[cases."primitives.vecs.reverse_i32.basic"]
summary = "i32 vectors reverse"
description = "A non-empty i32 vector crosses the wire and returns in reverse order."
exercises = ["primitives::vecs::reverse_vec_i32"]

[cases."primitives.vecs.echo_string.basic"]
summary = "String vectors round-trip"
description = "A non-empty string vector crosses the wire and returns unchanged."
exercises = ["primitives::vecs::echo_vec_string"]

