[cases."async_fns.basic.scalar_string_vec"]
summary = "Top-level async functions return scalar, string, option, and vector values"
description = "Top-level async functions cross the boundary for integer addition, string echo, vector mapping, optional search, and string-vector concatenation."
exercises = [
  "async_fns::async_add",
  "async_fns::async_echo",
  "async_fns::async_double_all",
  "async_fns::async_find_positive",
  "async_fns::async_concat",
]

[cases."async_fns.basic.scalar_string_vec".excluded_platforms]
python = "The Python demo tests do not currently cover async functions."

[cases."async_fns.basic.get_numbers"]
summary = "Async functions can return generated vectors"
description = "An async function can generate and return a vector of integers."
exercises = ["async_fns::async_get_numbers"]

[cases."async_fns.basic.get_numbers".excluded_platforms]
java = "The Java async function demo does not currently cover async_get_numbers."
kotlin = "The Kotlin async function demo does not currently cover async_get_numbers."
python = "The Python demo tests do not currently cover async functions."
wasm = "The WASM async function demo does not currently cover async_get_numbers."

[cases."async_fns.results.compute_fetch"]
summary = "Top-level async functions return typed and string errors"
description = "Async functions can return successful values and error values through typed result and string-error result surfaces."
exercises = [
  "async_fns::try_compute_async",
  "async_fns::fetch_data",
]

[cases."async_fns.results.compute_fetch".excluded_platforms]
java = "The Java async function demo does not currently cover try_compute_async or fetch_data."
kotlin = "The Kotlin async function demo does not currently cover try_compute_async or fetch_data."
python = "The Python demo tests do not currently cover async functions."

[cases."async_fns.mixed_record.roundtrip"]
summary = "Async functions carry mixed records"
description = "Async functions can round-trip and construct mixed records containing strings, records, enums, options, and vectors."
exercises = [
  "async_fns::async_echo_mixed_record",
  "async_fns::async_make_mixed_record",
]

[cases."async_fns.mixed_record.roundtrip".excluded_platforms]
python = "The Python demo tests do not currently cover async functions."
