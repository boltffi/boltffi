[cases."options.primitives.i32.some_none_and_helpers"]
summary = "Primitive i32 options support present and absent values"
description = "i32 options round-trip through Some and None branches and support defaulting, construction, and transformation helpers."
exercises = [
  "options::primitives::echo_optional_i32",
  "options::primitives::unwrap_or_default_i32",
  "options::primitives::make_some_i32",
  "options::primitives::make_none_i32",
  "options::primitives::double_if_some",
]

[cases."options.primitives.i32.some_none_and_helpers".excluded_platforms]
python = "The Python demo tests do not currently cover Option surfaces."

