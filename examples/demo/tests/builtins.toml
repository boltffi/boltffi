[cases."builtins.duration.basic"]
summary = "Duration values round-trip and convert"
description = "Duration values cross the wire, can be constructed from seconds and nanoseconds, and convert to milliseconds."
exercises = [
  "builtins::echo_duration",
  "builtins::make_duration",
  "builtins::duration_as_millis",
]

[cases."builtins.duration.basic".excluded_platforms]
csharp = "The C# demo tests do not currently cover built-in Duration values."
java = "The Java demo tests do not currently cover built-in Duration values."
python = "The Python demo tests do not currently cover built-in values."

[cases."builtins.system_time.basic"]
summary = "SystemTime values round-trip and convert"
description = "SystemTime values cross the wire and convert to and from Unix epoch milliseconds."
exercises = [
  "builtins::echo_system_time",
  "builtins::system_time_to_millis",
  "builtins::millis_to_system_time",
]

[cases."builtins.system_time.basic".excluded_platforms]
csharp = "The C# demo tests do not currently cover built-in SystemTime values."
java = "The Java demo tests do not currently cover built-in SystemTime values."
python = "The Python demo tests do not currently cover built-in values."

