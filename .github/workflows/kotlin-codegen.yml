name: Kotlin codegen

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  kotlin:
    name: Kotlin ${{ matrix.kotlin }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kotlin: ['2.2.10', '2.2.20']
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin compiler
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v${{ matrix.kotlin }}/kotlin-compiler-${{ matrix.kotlin }}.zip -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: cargo test -p boltffi_backend --test kotlin
