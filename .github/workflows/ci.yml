name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache in other jobs
          cache: false
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
      - run: cargo test --workspace --all-features

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
          key: ${{ matrix.target }}
      - run: cargo build --profile release-lto --target ${{ matrix.target }} -p boltffi_cli

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
      - run: cargo build --profile release-lto -p boltffi_cli
      - run: ./target/release-lto/boltffi --version

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
      - run: cargo doc --workspace --no-deps

  miri:
    name: Miri
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target-miri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p boltffi -p boltffi_core -p boltffi_tests

  android-packaging:
    name: Android Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/demo
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
          key: android-packaging-${{ matrix.os }}
          workspaces: .
      - run: cargo run -p boltffi_cli --manifest-path ../../Cargo.toml -- check --android --fix
      - run: cargo run -p boltffi_cli --manifest-path ../../Cargo.toml -- -v pack android

  demo-test-audit:
    name: Demo Test Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo run --manifest-path examples/demo/Cargo.toml --bin demo-tests -- audit

  demo-platforms:
    name: Demo Platforms (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # caching handled by Swatinem/rust-cache below
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
          key: demo-platforms-${{ matrix.os }}-${{ matrix.python-version }}
      - if: matrix.python-version == '3.13'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - if: matrix.python-version == '3.13'
        run: npm install -g typescript
      - if: matrix.python-version == '3.13'
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install --upgrade pip setuptools wheel
      - if: matrix.python-version == '3.13'
        run: ./examples/demo/verify-platform-demos.sh --host-defaults --python python
        shell: bash
      - if: matrix.python-version != '3.13'
        run: ./examples/demo/verify-platform-demos.sh --platform python --python python
        shell: bash

  csharp-windows-arm64:
    name: C# Windows x64 + ARM64 package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: false
          prefix-key: v1-rust
          key: csharp-windows-arm64
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build dual-architecture NuGet package
        working-directory: examples/demo
        shell: bash
        run: >-
          cargo run --quiet --manifest-path ../../Cargo.toml -p boltffi_cli --
          --overlay boltffi.csharp-windows.toml
          --cargo-arg=--features
          --cargo-arg=csharp-demo
          pack csharp
      - name: Verify package assets and PE architectures
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'examples/platforms/csharp/dist'
          $package = Get-ChildItem -LiteralPath (Join-Path $dist 'packages') -Filter '*.nupkg' | Select-Object -First 1
          if (-not $package) { throw 'NuGet package was not generated' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = $archive.Entries.FullName -replace '\\', '/'
            foreach ($expected in @(
              'runtimes/win-x64/native/demo.dll',
              'runtimes/win-arm64/native/demo.dll'
            )) {
              if ($entries -notcontains $expected) { throw "Missing NuGet asset: $expected" }
            }
          } finally {
            $archive.Dispose()
          }

          function Get-PeMachine([string] $Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          $x64Machine = Get-PeMachine (Join-Path $dist 'runtimes/win-x64/native/demo.dll')
          $arm64Machine = Get-PeMachine (Join-Path $dist 'runtimes/win-arm64/native/demo.dll')
          if ($x64Machine -ne 0x8664) { throw ('win-x64 asset has unexpected PE machine 0x{0:X4}' -f $x64Machine) }
          if ($arm64Machine -ne 0xaa64) { throw ('win-arm64 asset has unexpected PE machine 0x{0:X4}' -f $arm64Machine) }
      - name: Verify win-arm64 NuGet restore and publish
        shell: pwsh
        run: |
          $project = Join-Path $PWD 'examples/platforms/csharp/DemoTest/DemoTest.csproj'
          $nugetConfig = Join-Path $PWD 'examples/platforms/csharp/DemoTest/NuGet.windows-arm64.config'
          $packagesCache = Join-Path $PWD 'examples/platforms/csharp/dist/.nuget/windows-arm64'
          $publishDir = Join-Path $PWD 'examples/platforms/csharp/dist/publish/win-arm64'
          dotnet publish $project `
            --runtime win-arm64 `
            --self-contained false `
            --property:RestoreConfigFile=$nugetConfig `
            --property:RestorePackagesPath=$packagesCache `
            --property:RestoreNoCache=true `
            --output $publishDir `
            --nologo
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'demo.dll'))) {
            throw 'win-arm64 native asset was not selected for publish'
          }
